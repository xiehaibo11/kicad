syntax = "proto3";

package kiapi.common.commands;

import "common/types/base_types.proto";
import "common/types/enums.proto";
import "common/types/jobs.proto";

message GetVersion
{
}

message GetVersionResponse
{
  kiapi.common.types.KiCadVersion version = 1;
}

// A command to check if the connection to KiCad is OK
message Ping
{
}

// Returns the full path to the given KiCad binary
message GetKiCadBinaryPath
{
  // The short name of the binary, such as `kicad-cli` or `kicad-cli.exe`.  If on Windows, an `.exe`
  // extension will be assumed if not present.
  string binary_name = 1;
}

message PathResponse
{
  string path = 1;
}

// returns kiapi.common.types.Box2
message GetTextExtents
{
  // A temporary text item to calculate the bounding box for
  kiapi.common.types.Text text = 1;
}

message TextOrTextBox
{
  oneof inner {
    kiapi.common.types.Text text = 1;
    kiapi.common.types.TextBox textbox = 2;
  }
}

// Render the given text object(s) as shapes.  Depending on whether the text is using
// the KiCad stroke font or a custom font, the response will be a compound shape containing
// a set of polygons or a set of segments.
message GetTextAsShapes
{
  repeated TextOrTextBox text = 1;
}

message TextWithShapes
{
  TextOrTextBox text = 1;

  kiapi.common.types.CompoundShape shapes = 2;
}

message GetTextAsShapesResponse
{
  repeated TextWithShapes text_with_shapes = 1;
}

// Return a writeable path that a plugin can use for storing persistent data such as configuration
// files, etc.  This path may not yet exist; actual creation of the directory for a given plugin is
// up to the plugin itself.  Files in this path will not be modified if the plugin is uninstalled or
// upgraded.
//
// Returns StringResponse
message GetPluginSettingsPath
{
  // The identifier of the plugin
  string identifier = 1;
}

message StringResponse
{
  string response = 1;
}

// Returns the set of well-known filesystem paths used by KiCad.
// These paths are not guaranteed to actually exist or be accessible to an API client.
// The meaning of these paths and their actual location are not API guarantees.
// Returns GetPathsResponse
message GetPaths
{
}

message PathEntry
{
  kiapi.common.types.PathType type = 1;

  // Absolute path in platform-native form; may not exist on disk
  string path = 2;
}

message GetPathsResponse
{
  repeated PathEntry paths = 1;
}

// Introspection command: returns the automation capabilities served by this instance.
// Clients (including AI tool bridges) use this as the single source of truth for tool
// discovery instead of hard-coding command lists.
message GetCapabilities
{
}

message Capability
{
  // Stable capability identifier, e.g. "board.drc.run" or "board.items.create".
  string id = 1;

  // Transport layer that can serve this capability: "api", "cli", or "api+cli".
  string layer = 2;

  // Fully-qualified request message type for API capabilities.
  string request_type = 3;

  // Fully-qualified response message type for API capabilities.
  string response_type = 4;

  // CLI command path for CLI capabilities, e.g. "pcb drc".
  string cli_command = 5;

  // True if the capability is experimental and may change without notice.
  bool experimental = 6;

  // KiCad version in which the capability became available.
  string since = 7;

  // Short human-readable description.
  string description = 8;
}

message GetCapabilitiesResponse
{
  string api_version = 1;
  repeated Capability capabilities = 2;
}

// Returns the state of a job previously started through a RunJob command.
message GetJobStatus
{
  string job_id = 1;
}

message JobStatusResponse
{
  string job_id = 1;
  kiapi.common.types.JobStatus status = 2;
  int64 elapsed_ms = 3;
  string message = 4;
  string result_json = 5;
  repeated kiapi.common.types.JobDiagnostic diagnostics = 6;
}

// Requests cooperative cancellation of a running job.
message CancelJob
{
  string job_id = 1;
}

message CancelJobResponse
{
  string job_id = 1;
  bool cancel_requested = 2;
  string message = 3;
}
