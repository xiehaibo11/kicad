enum InactiveLayerDisplayMode
{
  ILDM_UNKNOWN = 0;
  // Inactive layers are shown
  ILDM_NORMAL = 1;
  // Inactive layers are shown with dimmed colors
  ILDM_DIMMED = 2;
  // Inactive layers are hidden
  ILDM_HIDDEN = 3;
}

enum NetColorDisplayMode
{
  NCDM_UNKNOWN = 0;
  // Net and netclass colors are shown in the ratsnest and on all copper items
  NCDM_ALL = 1;
  // Net and netclass colors are shown in the ratsnest only
  NCDM_RATSNEST = 2;
  // Net and netclass colors are not shown
  NCDM_OFF = 3;
}

enum BoardFlipMode
{
  BFM_UNKNOWN = 0;
  // Normal ("non-flipped") mode
  BFM_NORMAL = 1;
  // "Flipped" mode, viewed from the back and mirrored around the X axis
  BFM_FLIPPED_X = 2;
}

enum RatsnestDisplayMode
{
  RDM_UNKNOWN = 0;
  // Ratsnest lines are drawn to objects even if they are on hidden layers
  RDM_ALL_LAYERS = 1;
  // Ratsnest lines are hidden when at least one endpoint is an item on a hidden layer
  RDM_VISIBLE_LAYERS = 2;
}

message BoardEditorAppearanceSettings
{
  InactiveLayerDisplayMode inactive_layer_display = 1;

  NetColorDisplayMode net_color_display = 2;

  BoardFlipMode board_flip = 3;

  RatsnestDisplayMode ratsnest_display = 4;
}

// Returns BoardEditorAppearanceSettings
message GetBoardEditorAppearanceSettings
{
}

message SetBoardEditorAppearanceSettings
{
  BoardEditorAppearanceSettings settings = 1;
}

// Returns BoardPlotSettingsResponse
message GetBoardPlotSettings
{
  kiapi.common.types.DocumentSpecifier board = 1;
}

message SetBoardPlotSettings
{
  kiapi.common.types.DocumentSpecifier board = 1;
  kiapi.board.jobs.BoardPlotSettings plot_settings = 2;
}

message BoardPlotSettingsResponse
{
  kiapi.board.jobs.BoardPlotSettings plot_settings = 1;
}

enum BoardFlipDirection
{
  BFD_UNKNOWN    = 0;
  BFD_LEFT_RIGHT = 1; // Flip left to right (around the Y axis)
  BFD_TOP_BOTTOM = 2; // Flip top to bottom (around the X axis)
}

// Flips one or more board items to the opposite side of the board.  Returns FlipItemsResponse.
message FlipItems
{
  kiapi.common.types.ItemHeader header = 1;

  repeated kiapi.common.types.KIID items = 2;

  // Direction to flip the items; BFD_TOP_BOTTOM if unspecified.
  BoardFlipDirection direction = 3;
}

message ItemFlipResult
{
  kiapi.common.commands.ItemStatus status = 1;

  // Updated version of the item after the flip (only populated when status.status is ISC_OK)
  google.protobuf.Any item = 2;
}

message FlipItemsResponse
{
  kiapi.common.types.ItemHeader header = 1;

  // Status of the overall request; may return IRS_OK even if no items were flipped
  kiapi.common.types.ItemRequestStatus status = 2;

  repeated ItemFlipResult flipped_items = 3;
}


//// Interactive commands ////
// These commands begin an interactive operation in the editor.
// They return a response immediately, but the editor will become busy
// and will not reply to further API commands until the user has finished
// the operation.
// These commands will return an error if received in a non-interactive context.

// Selects and begins an interactive move of the given item(s).
// NOTE: Takes ownership of the active commit, if one exists:
//       the move tool will push the commit when the user confirms the move,
//       or roll back the commit if the user cancels the move.  Keep this in
//       mind if using this command in combination with commands that create
//       or modify items using an explicit commit.
message InteractiveMoveItems
{
  kiapi.common.types.DocumentSpecifier board = 1;

  repeated kiapi.common.types.KIID items = 2;
}


//// Verification commands ////

// Prove that pads/vias (or all pads and vias) are actually connected to copper, including
// filled inner-layer zones/planes.  Unlike a bare connectivity query, this also verifies that
// a zone has materialized filled polygons on a shared layer, which catches "poured but empty"
// failures.
message ProveConnectivity
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Anchors to prove.  If empty, all pads and vias on the board are used.
  repeated kiapi.common.types.KIID anchors = 2;

  // Optional net filter.  If non-empty, only anchors on these nets are reported.
  repeated string nets = 3;

  // When true (default), a zone connection only counts if the zone has real filled polygons.
  optional bool require_filled_zones = 4;
}

message ConnectivityEndpoint
{
  kiapi.common.types.KIID item = 1;

  // "pad", "via", "track", "arc", or "item".
  string item_type = 2;

  string reference = 3;
  string pad_number = 4;
  string net = 5;

  // True if the anchor has at least one real copper connection (non-zone item, or a
  // materialized filled zone).
  bool has_copper_connection = 6;

  repeated kiapi.common.types.KIID connected_items = 7;

  // Filled zones whose polygons actually contain the anchor position.
  repeated kiapi.common.types.KIID zone_islands = 8;

  bool inside_filled_zone = 9;
}

message ConnectivityProof
{
  // True if every reported endpoint with a non-empty net has a copper connection.
  bool ok = 1;

  repeated ConnectivityEndpoint endpoints = 2;

  // Nets whose ratsnest still has edges (not a single copper cluster).
  repeated string unconnected_nets = 3;

  uint32 unconnected_count = 4;

  repeated kiapi.common.types.KIID dangling_items = 5;
}


//// Placement commands ////

// Automatically place footprints using KiCad's autoplacer (AR_AUTOPLACER).
// The board must have a closed Edge_Cuts outline.
message AutoPlaceFootprints
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Footprints to place.  If empty, all footprints on the board are used.
  repeated kiapi.common.types.KIID footprints = 2;

  // Allow the autoplacer to move footprints that are outside the board outline.
  bool place_offboard = 3;

  // Report what would be done without modifying the board.
  bool dry_run = 4;
}

message AutoPlaceFootprintsResponse
{
  repeated kiapi.common.types.KIID placed = 1;
  repeated string skipped = 2;
  string report = 3;
}


//// Plane commands ////

// Create a copper zone bound to an arbitrary net on one or more copper layers.
// Inner layers are the usual choice for a plane; outer layers are also accepted.
// In KiCad an inner "plane" is a net-bound filled copper zone, not a layer type.
message CreatePlane
{
  kiapi.common.types.DocumentSpecifier board = 1;

  // Net to assign to the plane.
  string net = 2;

  // Copper layers on which to create the zone.
  repeated kiapi.board.types.BoardLayer layers = 3;

  // Plane outline in board coordinates.  If fewer than three points are given,
  // the board edge bounding box is used.
  repeated kiapi.common.types.Vector2 outline = 4;

  // Optional zone clearance.
  kiapi.common.types.Distance clearance = 5;

  // Optional minimum copper thickness.
  kiapi.common.types.Distance min_thickness = 6;

  // Zone priority.
  uint32 priority = 7;

  // Human-readable zone name (also usable in DRC expressions).
  string name = 8;

  // Fill the zone immediately.
  bool fill = 9;
}

message PlaneInfo
{
  kiapi.common.types.KIID zone = 1;
  string net = 2;
  repeated kiapi.board.types.BoardLayer layers = 3;
  bool filled = 4;

  // True only if every assigned layer has non-empty filled polygons.
  bool has_filled_polygons = 5;

  uint64 filled_area_nm2 = 6;
  uint32 connected_pads = 7;
  uint32 connected_vias = 8;
}

message CreatePlaneResponse
{
  PlaneInfo plane = 1;
}

// Re-verify a plane: materialized fill plus pad/via connectivity.
message VerifyPlane
{
  kiapi.common.types.DocumentSpecifier board = 1;
  kiapi.common.types.KIID zone = 2;
}

message VerifyPlaneResponse
{
  PlaneInfo plane = 1;
  repeated kiapi.common.types.KIID unconnected_pads = 2;
  repeated kiapi.common.types.KIID unconnected_vias = 3;
}
